<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Words">
<meta name="theme-color" content="#20343D">
<title>Words: English, Emirati, Korean</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Gowun+Batang:wght@400;700&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#20343D; --desk-ink:#E7E9E1; --desk-muted:#9FB4B0;
  --paper:#ECEEE6; --paper-2:#E0E4D9; --ink:#1C2A31; --muted:#5E6E70; --rule:#C9D0C3;
  --sadu:#9A2B22; --celadon:#3B7163; --gold:#C29A4E; --cover-ink:#F2EEE3; --band:#1C2A31;
  --f-en:'Alegreya',Georgia,'Times New Roman',serif;
  --f-ar:'Noto Naskh Arabic','Geeza Pro','Arial',serif;
  --f-ko:'Gowun Batang','Apple SD Gothic Neo','Malgun Gothic',serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --desk:#0F1619; --desk-ink:#E4E2D8; --desk-muted:#8A9A98;
    --paper:#1D2427; --paper-2:#161C1F; --ink:#E6E2D6; --muted:#9AA7A6; --rule:#34403F;
    --sadu:#B4433A; --celadon:#7DB3A3; --gold:#D1AC62; --band:#0F1619; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --desk:#0F1619; --desk-ink:#E4E2D8; --desk-muted:#8A9A98;
  --paper:#1D2427; --paper-2:#161C1F; --ink:#E6E2D6; --muted:#9AA7A6; --rule:#34403F;
  --sadu:#B4433A; --celadon:#7DB3A3; --gold:#D1AC62; --band:#0F1619; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--desk);color:var(--desk-ink);font-family:var(--f-en);
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;overflow:hidden}
[hidden]{display:none!important}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.lf-ko{font-family:var(--f-ko)} .lf-ar{font-family:var(--f-ar)}

#app{height:100%;display:grid;grid-template-rows:auto 1fr auto;max-width:560px;margin:0 auto}
.top{display:flex;align-items:center;gap:4px;padding:8px 10px 2px}
.where{flex:1;min-width:0;text-align:center}
.where .t{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.where .p{font-size:13px;color:var(--desk-muted)}
.icon-btn{width:42px;height:42px;border-radius:50%;border:0;background:transparent;color:inherit;display:grid;place-items:center;flex:none}
.icon-btn:disabled{opacity:.28}
.icon-btn svg{width:22px;height:22px}
.scrub{padding:2px 20px 6px}
.scrub input{width:100%;accent-color:var(--gold);margin:0;height:22px}
.stage{min-height:0;display:flex;justify-content:center;padding:4px 16px 8px}

#book{position:relative;width:100%;max-width:460px;height:100%;max-height:860px;perspective:2200px;
  touch-action:pan-y;user-select:none;-webkit-user-select:none}
.edges{position:absolute;inset:0;border-radius:4px 14px 14px 4px;background:var(--paper-2);
  box-shadow:2px 1px 0 var(--paper-2),3px 2px 0 var(--rule),5px 3px 0 var(--paper-2),6px 4px 0 var(--rule),0 18px 40px rgba(0,0,0,.35)}
.page,.flipper{position:absolute;inset:0}
.page{z-index:1}
.flipper{transform-origin:left center;transform-style:preserve-3d;z-index:3;will-change:transform}
.face{position:absolute;inset:0;background:var(--paper);color:var(--ink);border-radius:4px 14px 14px 4px;overflow:hidden;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column}
.face::before{content:'';position:absolute;left:0;top:0;bottom:0;width:22px;pointer-events:none;z-index:1;
  background:linear-gradient(to right,rgba(0,0,0,.16),rgba(0,0,0,0))}
.face.back{transform:rotateY(180deg);background:linear-gradient(to left,var(--paper-2),var(--paper))}
.shade{position:absolute;inset:0;pointer-events:none;z-index:4;opacity:0;
  background:linear-gradient(to left,rgba(0,0,0,.5),rgba(0,0,0,0) 80%)}
.under-shade{position:absolute;inset:0;border-radius:4px 14px 14px 4px;pointer-events:none;z-index:2;opacity:0;
  background:linear-gradient(to right,rgba(0,0,0,.45),rgba(0,0,0,0) 75%)}

/* sadu weave band */
.sadu{height:30px;flex:none;background:
  linear-gradient(var(--gold) 0 0) top/100% 3px no-repeat,
  linear-gradient(var(--gold) 0 0) bottom/100% 3px no-repeat,
  linear-gradient(135deg,var(--cover-ink) 25%,transparent 25%) -8px 7px/16px 16px repeat-x,
  linear-gradient(225deg,var(--cover-ink) 25%,transparent 25%) -8px 7px/16px 16px repeat-x,
  linear-gradient(315deg,var(--sadu) 25%,transparent 25%) 0 7px/16px 16px repeat-x,
  linear-gradient(45deg,var(--sadu) 25%,transparent 25%) 0 7px/16px 16px repeat-x,
  var(--band)}
.sadu.thin{height:16px;background:
  linear-gradient(135deg,var(--gold) 25%,transparent 25%) -6px 2px/12px 12px repeat-x,
  linear-gradient(225deg,var(--gold) 25%,transparent 25%) -6px 2px/12px 12px repeat-x,
  linear-gradient(315deg,var(--sadu) 25%,transparent 25%) 0 2px/12px 12px repeat-x,
  linear-gradient(45deg,var(--sadu) 25%,transparent 25%) 0 2px/12px 12px repeat-x,
  var(--band)}

/* cover */
.face[data-type="cover"]{background:var(--sadu);color:var(--cover-ink)}
.face[data-type="cover"]::before{background:linear-gradient(to right,rgba(0,0,0,.35),rgba(0,0,0,0))}
.cover{flex:1;display:flex;flex-direction:column;justify-content:space-between;padding:0}
.cover-main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:20px;padding:24px 26px 24px 36px}
.cover-title{display:flex;flex-direction:column}
.t-en{font-size:clamp(58px,18vw,88px);font-weight:800;line-height:.92;letter-spacing:-.02em}
.t-ar{font-family:var(--f-ar);font-size:clamp(50px,15vw,74px);line-height:1.35;text-align:right;font-weight:600}
.t-ko{font-family:var(--f-ko);font-size:clamp(50px,15vw,76px);font-weight:700;line-height:1.05}
.cover-sub{font-size:17px;line-height:1.45;max-width:28ch;margin:0;opacity:.92}
.open-btn{align-self:flex-start;background:var(--cover-ink);color:#8A241C;border:0;border-radius:999px;padding:12px 22px;font:700 16px var(--f-en)}

/* guide */
.guide{flex:1;overflow:auto;padding:24px 20px 16px 34px}
.guide h2{font-size:26px;line-height:1.1;margin:0 0 12px;font-weight:800}
.guide ul{margin:0 0 14px;padding-left:18px}
.guide li{font-size:15.5px;line-height:1.45;margin-bottom:6px}
.guide h3{font-size:16px;margin:4px 0 6px;color:var(--sadu)}
.key{display:grid;grid-template-columns:repeat(4,1fr);gap:6px 10px;font-size:15px;margin-bottom:10px}
.key span{display:flex;gap:6px;align-items:baseline}
.key b{font-weight:700;min-width:1.6em}
.key i{font-style:normal;font-family:var(--f-ar);font-size:18px}
.guide p{font-size:14.5px;line-height:1.45;color:var(--muted);margin:0 0 6px}

/* chapter opener */
.chap{flex:1;display:flex;flex-direction:column;justify-content:center;gap:4px;padding:30px 24px 20px 36px}
.chap-num{font-size:15px;color:var(--sadu);font-weight:700}
.chap-en{font-size:clamp(38px,11vw,54px);line-height:1.02;margin:6px 0 14px;font-weight:800;letter-spacing:-.01em}
.chap-ko{font-family:var(--f-ko);font-size:28px;font-weight:700}
.chap-ar{font-family:var(--f-ar);font-size:30px;text-align:right;font-weight:600}
.chap-meta{margin-top:24px;font-size:15px;color:var(--muted)}
.bar{height:4px;background:var(--rule);border-radius:2px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--celadon)}

/* word pages */
.wp{flex:1;display:flex;flex-direction:column;min-height:0;padding:14px 14px 0 28px}
.wp-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px;color:var(--muted);padding-bottom:6px}
.wp-head b{color:var(--sadu);font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cols,.row{display:grid;grid-template-columns:1.05fr 1fr 1fr;gap:8px}
.cols{border-bottom:1.5px solid var(--ink);padding-bottom:4px}
.cols button{background:none;border:0;padding:4px 0;font:700 13.5px var(--f-en);color:var(--celadon);text-align:left;display:flex;align-items:center;gap:4px;min-height:30px}
.cols button[data-col="ko"]{font-family:var(--f-ko)}
.cols button[data-col="ar"]{justify-content:flex-end;font-family:var(--f-ar);font-size:14.5px}
.cols button.off{color:var(--muted);text-decoration:line-through}
.rows{list-style:none;margin:0;padding:0;flex:1;overflow:auto;min-height:0}
.row{align-items:center;min-height:62px;padding:7px 0;border-bottom:1px solid var(--rule);cursor:pointer}
.row:active{background:rgba(127,127,127,.08)}
.c{min-width:0}
.c b{display:block;font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.c-en b{font-size:17px}
.c-ko b{font-family:var(--f-ko);font-size:18px;font-weight:700}
.c-ko.rom b{font-family:var(--f-en);font-size:17px}
.c-ko.rom small{font-family:var(--f-ko);font-style:normal;font-size:14px;color:var(--muted)}
.icon-btn.txt{font:700 18px var(--f-en)}
.chap-rom{font-family:var(--f-en);font-size:19px;font-weight:600;color:var(--muted)}
.det-sub.big{font-size:22px;color:var(--ink)}
.c-ar{text-align:right}
.c-ar b{font-family:var(--f-ar);font-size:20px;line-height:1.35}
.c small{display:block;font-size:12.5px;color:var(--muted);font-style:italic;margin-top:1px;overflow-wrap:anywhere}
.mk{display:inline-flex;gap:5px;align-items:center;margin-top:3px;height:12px}
.mk svg{width:12px;height:12px;color:var(--sadu)}
.mk-dot{width:7px;height:7px;border-radius:50%;background:var(--celadon)}
#app.hide-en #book .c-en:not(.peek)>*,
#app.hide-ko #book .c-ko:not(.peek)>*,
#app.hide-ar #book .c-ar:not(.peek)>*{filter:blur(7px);opacity:.5}
.page-foot{flex:none;font-size:12.5px;color:var(--muted);text-align:center;padding:6px 0 8px}

/* end */
.end{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:24px 24px 24px 36px}
.end h2{font-size:44px;margin:0;font-weight:800}
.end p{font-size:17px;line-height:1.45;margin:0;color:var(--muted)}
.end .row-btns{display:flex;gap:10px;flex-wrap:wrap}

/* korean alphabet pages */
.jgrid{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 0;min-height:0}
.jcell{display:flex;align-items:center;gap:10px;border:1px solid var(--rule);border-radius:14px;background:var(--paper-2);color:var(--ink);padding:8px 10px;text-align:left}
.jcell:active{transform:scale(.97)}
.jchar{font-family:var(--f-ko);font-size:34px;font-weight:700;line-height:1}
.jinfo{display:flex;flex-direction:column;font-size:13px;color:var(--muted);min-width:0}
.jinfo b{font-size:15px;color:var(--ink)}
.jinfo bdi{font-family:var(--f-ar);font-size:15px}

/* writing pad */
.strip{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;-webkit-overflow-scrolling:touch}
.schip{flex:none;border:1.5px solid var(--rule);background:transparent;color:var(--ink);border-radius:10px;padding:8px 12px;font:600 16px var(--f-en);min-height:42px}
.schip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.pad{position:relative;width:min(100%,320px);aspect-ratio:1;margin:0 auto;background:var(--paper-2);border:1.5px solid var(--rule);border-radius:16px;overflow:hidden}
.pad::before,.pad::after{content:'';position:absolute;background:repeating-linear-gradient(to right,var(--rule) 0 6px,transparent 6px 12px);pointer-events:none}
.pad::before{left:0;right:0;top:50%;height:1px}
.pad::after{top:0;bottom:0;left:50%;width:1px;background:repeating-linear-gradient(to bottom,var(--rule) 0 6px,transparent 6px 12px)}
.pad-model{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(70px,34vw,150px);line-height:1;color:var(--rule);padding:8px;text-align:center;overflow-wrap:anywhere;pointer-events:none}
.pad-model.off{opacity:0}
.pad-model:not(.lf-ko):not(.lf-ar){font-size:clamp(40px,16vw,74px)}
.pad-strokes{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;fill:none;stroke:var(--celadon);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;transition:opacity .4s}
.pad-ink{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.pad-info{font-size:15px;color:var(--muted);text-align:center;margin:12px 0 10px;line-height:1.5}
.pad-info b{color:var(--ink)}
.pad-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(5,1fr);padding:2px 4px 6px}
.tab{background:none;border:0;color:var(--desk-muted);display:flex;flex-direction:column;align-items:center;gap:3px;font:600 11.5px var(--f-en);padding:6px 0;min-height:48px}
.tab svg{width:23px;height:23px}
.tab:active{color:var(--desk-ink)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:20;display:none;background:rgba(5,12,14,.5)}
.sheet.open{display:flex;align-items:flex-end;justify-content:center}
.sheet-card{width:100%;max-width:560px;max-height:90%;background:var(--paper);color:var(--ink);border-radius:20px 20px 0 0;
  display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet-head{display:flex;align-items:center;gap:4px;padding:10px 10px 6px 14px}
.sheet-head h3{flex:1;margin:0;font-size:21px;font-weight:800;padding-left:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-body{overflow:auto;padding:4px 20px 22px;-webkit-overflow-scrolling:touch}
.sheet .row{grid-template-columns:1.05fr 1fr 1fr}
.list{list-style:none;margin:0;padding:0}
.hint{font-size:14px;color:var(--muted);margin:10px 0 4px}
.empty{padding:20px 0;font-size:16px;line-height:1.5}
.empty p{margin:0 0 8px}
.search{width:100%;font:17px var(--f-en);padding:12px 14px;border-radius:12px;border:1.5px solid var(--rule);background:var(--paper-2);color:var(--ink);-webkit-appearance:none}
.search:focus{outline:none;border-color:var(--celadon)}

.toc{list-style:none;margin:0;padding:0}
.toc-item{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;width:100%;background:none;border:0;border-bottom:1px solid var(--rule);padding:10px 0;text-align:left;color:inherit;font:inherit}
.toc-item.here .toc-n{background:var(--sadu);color:var(--cover-ink)}
.toc-n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--sadu);font-weight:800;font-size:15px}
.toc-t b{display:block;font-size:17px;font-weight:700}
.toc-sub{font-size:14.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.toc-p{font-size:13px;color:var(--muted)}

.det{display:flex;flex-direction:column;gap:10px}
.det-block{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--paper-2)}
.det-lang{font-size:13px;color:var(--celadon);font-weight:700}
.det-word{font-size:32px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.det-block.ar .det-word{text-align:right}
.det-sub{font-size:15px;color:var(--muted);font-style:italic}
.det-block.ar .det-sub{text-align:right}
.speak{width:48px;height:48px;border-radius:50%;border:0;background:var(--celadon);color:var(--paper);display:grid;place-items:center;flex:none}
.speak svg{width:22px;height:22px}
.speak.sm{width:42px;height:42px;margin:10px auto 0}
.det-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.btn{border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:12px;padding:12px;font:700 15px var(--f-en);display:flex;align-items:center;justify-content:center;gap:6px;min-height:48px}
.btn svg{width:18px;height:18px}
.btn.on{background:var(--ink);color:var(--paper)}
.btn.primary{background:var(--sadu);border-color:var(--sadu);color:var(--cover-ink)}
.btn.wide{grid-column:1/-1;width:100%}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 16px}
.chip{border:1.5px solid var(--rule);background:transparent;color:var(--ink);border-radius:999px;padding:9px 15px;font:600 15px var(--f-en);min-height:42px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.sheet h4{margin:6px 0 0;font-size:15px}
.warn{color:var(--sadu);font-size:15px;margin:0 0 12px}
.q-top{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-top:4px}
.q-prompt{text-align:center;padding:22px 0 16px}
.q-word{font-size:42px;font-weight:800;line-height:1.2}
.q-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.opt{min-height:78px;border:1.5px solid var(--rule);border-radius:14px;background:var(--paper-2);color:var(--ink);padding:10px;font:600 19px var(--f-en);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px}
.opt small{font-size:12.5px;color:var(--muted);font-style:italic;font-weight:400}
.opt.right{border-color:var(--celadon);box-shadow:inset 0 0 0 2px var(--celadon)}
.opt.wrong{border-color:var(--sadu);box-shadow:inset 0 0 0 2px var(--sadu)}
.opt:disabled{cursor:default}
.score{font-size:56px;font-weight:800;margin:10px 0 0;line-height:1}
.score-sub{color:var(--muted);font-size:16px;margin:4px 0 16px}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(10px);z-index:40;
  background:var(--desk-ink);color:var(--desk);padding:10px 16px;border-radius:12px;font-size:15px;max-width:88vw;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){.sheet-card{animation:none}.toast{transition:none}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes inkfade{from{opacity:0}}
@media (prefers-reduced-motion:no-preference){
  .face[data-type="chapter"] .chap>*{animation:rise .55s cubic-bezier(.2,.8,.2,1) backwards}
  .face[data-type="chapter"] .chap>*:nth-child(2){animation-delay:.07s}
  .face[data-type="chapter"] .chap>*:nth-child(3){animation-delay:.13s}
  .face[data-type="chapter"] .chap>*:nth-child(4){animation-delay:.19s}
  .face[data-type="chapter"] .chap>*:nth-child(5){animation-delay:.25s}
  .face[data-type="chapter"] .chap>*:nth-child(6){animation-delay:.31s}
  .face[data-type="cover"] .cover-title>span{animation:rise .7s cubic-bezier(.2,.8,.2,1) backwards}
  .face[data-type="cover"] .cover-title>span:nth-child(2){animation-delay:.12s}
  .face[data-type="cover"] .cover-title>span:nth-child(3){animation-delay:.24s}
  .face[data-type="cover"] .cover-sub,.face[data-type="cover"] .open-btn{animation:rise .7s .36s cubic-bezier(.2,.8,.2,1) backwards}
  .face[data-type="end"] .end>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) backwards}
  .jcell{animation:inkfade .4s backwards}
  .jgrid .jcell:nth-child(n+3){animation-delay:.05s}
  .jgrid .jcell:nth-child(n+5){animation-delay:.1s}
  .jgrid .jcell:nth-child(n+7){animation-delay:.15s}
  .btn.on svg{animation:pop .3s}
  @keyframes pop{50%{transform:scale(1.35)}}
}
</style>
</head>
<body>

    const w={id:`c${ci}w${wi}`,ch:ci,en,ar,arl,ko,kor,i:WORDS.length};
    w.key=norm([en,ar,arl,ko,kor].join(' '));
    WORDS.push(w); c.items.push(w);
  });
});
const LANG={
  en:{name:'English',get:w=>w.en,sub:()=>''},
  ko:{name:'Korean',get:w=>w.ko,sub:w=>w.kor},
  ar:{name:'Emirati',get:w=>w.ar,sub:w=>w.arl}
};
const romOn=()=>!!store.s.roman;
const disp=(l,w)=>l==='ko'&&romOn()?w.kor:LANG[l].get(w);
const dsub=(l,w)=>l==='ko'&&romOn()?w.ko:LANG[l].sub(w);
const dfont=l=>l==='ko'&&romOn()?'en':l;

/* ---------- storage ---------- */
const store=(()=>{
  let s={fav:[],learned:[],anchor:null,hide:{en:false,ko:false,ar:false},theme:null,roman:true};
  try{const r=localStorage.getItem('words-book.v1'); if(r) s=Object.assign(s,JSON.parse(r));}catch(e){}
  return {s,save(){try{localStorage.setItem('words-book.v1',JSON.stringify(s))}catch(e){}}};
})();
const fav=new Set(store.s.fav), learned=new Set(store.s.learned);
function toggleSet(set,id,key){set.has(id)?set.delete(id):set.add(id);store.s[key]=[...set];store.save();}

/* ---------- theme ---------- */
function applyTheme(){
  if(store.s.theme) document.documentElement.setAttribute('data-theme',store.s.theme);
  else document.documentElement.removeAttribute('data-theme');
  const dark=getComputedStyle(document.documentElement).getPropertyValue('color-scheme').trim()==='dark';
  document.querySelector('meta[name=theme-color]').setAttribute('content',dark?'#0F1619':'#20343D');
}
function isDark(){return getComputedStyle(document.documentElement).getPropertyValue('color-scheme').trim()==='dark';}
applyTheme();

/* ---------- pages ---------- */
const book=$('#book'), underShade=$('#under'), scrub=$('#scrub');
let PAGES=[], chapterStart=[], jamoStart=2, perPage=6, cur=0, curEl=null, turning=null;

function computePerPage(){const h=book.clientHeight||600;return Math.max(3,Math.min(10,Math.floor((h-122)/64)));}
function buildPages(){
  PAGES=[{t:'cover'},{t:'guide'}]; chapterStart=[];
  jamoStart=PAGES.length;
  for(let k=0;k<JAMO_C.length;k+=8) PAGES.push({t:'jamo',kind:'Consonants',items:JAMO_C.slice(k,k+8)});
  for(let k=0;k<JAMO_V.length;k+=8) PAGES.push({t:'jamo',kind:'Vowels',items:JAMO_V.slice(k,k+8)});
  CH.forEach((c,ci)=>{
    chapterStart[ci]=PAGES.length; PAGES.push({t:'chapter',ci});
    for(let k=0;k<c.items.length;k+=perPage) PAGES.push({t:'words',ci,items:c.items.slice(k,k+perPage)});
  });
  PAGES.push({t:'end'});
}
const anchorOf=p=>p.t==='words'?{w:p.items[0].i}:p.t==='chapter'?{c:p.ci}:p.t==='jamo'?{j:p.items[0].c}:{t:p.t};
function findAnchor(a){
  if(!a) return 0;
  if('w' in a){const i=PAGES.findIndex(p=>p.t==='words'&&p.items.some(x=>x.i===a.w));return i<0?0:i;}
  if('j' in a){const i=PAGES.findIndex(p=>p.t==='jamo'&&p.items.some(x=>x.c===a.j));return i<0?jamoStart:i;}
  if('c' in a) return chapterStart[a.c]??0;
  if(a.t==='end') return PAGES.length-1;
  if(a.t==='guide') return 1;
  return 0;
}
const wordPage=w=>findAnchor({w:w.i});
const curChapter=()=>{const p=PAGES[cur];return p&&p.ci!=null?p.ci:0;};

function rowHTML(w){
  const f=fav.has(w.id), l=learned.has(w.id);
  const mk=(f||l)?`<span class="mk">${f?ic('star',1):''}${l?'<span class="mk-dot"></span>':''}</span>`:'';
  const ko=romOn()?`<b>${w.kor}</b><small class="lf-ko" lang="ko">${w.ko}</small>`:`<b>${w.ko}</b><small>${w.kor}</small>`;
  return `<li class="row${l?' is-learned':''}" data-w="${w.i}"><div class="c c-en"><b>${w.en}</b>${mk}</div><div class="c c-ko${romOn()?' rom':''}">${ko}</div><div class="c c-ar" lang="ar"><b dir="rtl">${w.ar}</b><small>${w.arl}</small></div></li>`;
}
function pageHTML(p,i){
  const foot=`<div class="page-foot">${i}</div>`;
  if(p.t==='cover') return `<div class="cover"><div class="sadu"></div><div class="cover-main"><div class="cover-title"><span class="t-en">Words</span><span class="t-ar" lang="ar" dir="rtl">كلمات</span><span class="t-ko" lang="ko">단어</span></div><p class="cover-sub">${WORDS.length} everyday words in English, Emirati Arabic and Korean.</p><button class="open-btn" data-act="next">Open the book</button></div><div class="sadu"></div></div>`;
  if(p.t==='jamo') return `<div class="wp"><div class="wp-head"><b>The Korean alphabet</b><span>${p.kind}</span></div><div class="jgrid">${p.items.map(j=>`<button class="jcell" data-jamo="${j.c}"><span class="jchar" lang="ko">${j.c}</span><span class="jinfo"><b>${j.rom}</b><span>${j.nrom} <span lang="ko" class="lf-ko">${j.name}</span></span><bdi class="lf-ar" lang="ar">${j.ar}</bdi></span></button>`).join('')}</div></div>${foot}`;
  if(p.t==='guide') return `<div class="guide"><h2>How this book works</h2><ul><li>Swipe or drag a page sideways to turn it.</li><li>Tap a word to hear it in all three languages, save it, or mark it learned.</li><li>Tap a column name to hide it and test yourself. Tap a hidden word to peek.</li><li>Tap a Korean letter on the next pages to see its strokes drawn, then write it yourself.</li><li>Use <b>Write</b> at the bottom to trace any letter or word with your finger.</li><li>Verbs: Emirati in the “he” form (yaakil, he eats), Korean in dictionary form (먹다).</li></ul><h3>Reading the Emirati line</h3><div class="key"><span><b>2</b><i>ء</i></span><span><b>3</b><i>ع</i></span><span><b>5</b><i>خ</i></span><span><b>6</b><i>ط</i></span><span><b>7</b><i>ح</i></span><span><b>9</b><i>ص</i></span><span><b>gh</b><i>غ</i></span><span><b>dh</b><i>ذ ض</i></span><span><b>th</b><i>ث</i></span><span><b>g</b><i>ق</i></span><span><b>ch</b><i>ك</i></span><span><b>y</b><i>ج</i></span></div><p>The Arabic script is the common spelling. The Latin line shows how it sounds in Emirati, so trust it over the audio.</p></div>${foot}`;
  if(p.t==='chapter'){
    const c=CH[p.ci], l=c.items.filter(w=>learned.has(w.id)).length;
    return `<div class="sadu thin"></div><div class="chap"><div class="chap-num">Chapter ${p.ci+1}</div><h2 class="chap-en">${c.en}</h2><div class="chap-ko" lang="ko">${c.ko} <span class="chap-rom">${c.kor}</span></div><div class="chap-ar" lang="ar" dir="rtl">${c.ar}</div><div class="chap-meta">${c.items.length} words, ${l} learned</div><div class="bar"><i style="width:${l/c.items.length*100}%"></i></div></div>${foot}`;
  }
  if(p.t==='words'){
    const h=store.s.hide;
    return `<div class="wp"><div class="wp-head"><b>${CH[p.ci].en}</b><span>Chapter ${p.ci+1}</span></div><div class="cols"><button data-col="en" class="${h.en?'off':''}" aria-pressed="${!h.en}">English</button><button data-col="ko" class="${h.ko?'off':''}" aria-pressed="${!h.ko}">${romOn()?'Korean':'한국어'}</button><button data-col="ar" class="${h.ar?'off':''}" aria-pressed="${!h.ar}">إماراتي</button></div><ul class="rows">${p.items.map(rowHTML).join('')}</ul></div>${foot}`;
  }
  const l=learned.size;
  return `<div class="sadu thin"></div><div class="end"><h2>The end</h2><p>You have learned ${l} of ${WORDS.length} words and saved ${fav.size}.</p><div class="row-btns"><button class="btn primary" data-act="practice">Practise now</button><button class="btn" data-act="start">Back to the cover</button></div></div>${foot}`;
}
function makeFace(p,i){const f=document.createElement('div');f.className='face front';f.dataset.type=p.t;f.innerHTML=pageHTML(p,i);return f;}
function fillCurrent(i){curEl.innerHTML='';curEl.appendChild(makeFace(PAGES[i],i));}
function showCurrent(){
  if(!curEl){curEl=document.createElement('div');curEl.className='page';book.insertBefore(curEl,underShade);}
  fillCurrent(cur); afterMove();
}
function refresh(){if(!turning) fillCurrent(cur);}
function afterMove(){
  store.s.anchor=anchorOf(PAGES[cur]); store.save();
  const p=PAGES[cur];
  $('#where-t').textContent=p.t==='cover'?'Words':p.t==='guide'?'How this book works':p.t==='jamo'?'The Korean alphabet':p.t==='end'?'The end':CH[p.ci].en;
  $('#where-p').textContent=cur===0?`${WORDS.length} words in ${CH.length} chapters`:`Page ${cur} of ${PAGES.length-1}`;
  scrub.max=PAGES.length-1; scrub.value=cur;
  $('#prev').disabled=cur===0; $('#next').disabled=cur===PAGES.length-1;
}

/* ---------- page turning ---------- */
function startTurn(dir,target){
  if(turning) return null;
  if(target==null) target=cur+dir;
  if(target<0||target>=PAGES.length||target===cur) return null;
  const fl=document.createElement('div'); fl.className='flipper';
  const front=makeFace(dir===1?PAGES[cur]:PAGES[target],dir===1?cur:target);
  const back=document.createElement('div'); back.className='face back';
  const shade=document.createElement('div'); shade.className='shade'; front.appendChild(shade);
  fl.append(front,back); fl.style.transition='none'; underShade.style.transition='none';
  book.appendChild(fl);
  if(dir===1) fillCurrent(target);
  const t={dir,target,fl,shade,from:dir===1?0:-180,to:dir===1?-180:0,angle:0};
  turning=t; setAngle(t,t.from); return t;
}
function setAngle(t,a){
  t.angle=a; t.fl.style.transform=`rotateY(${a}deg)`;
  const s=Math.sin(Math.abs(a)*Math.PI/180);
  t.shade.style.opacity=(s*.55).toFixed(3);
  underShade.style.opacity=((1-Math.abs(a)/180)*.9).toFixed(3);
}
function animate(t,commit){
  const end=commit?t.to:t.from, dist=Math.abs(end-t.angle);
  const dur=REDUCED?0:Math.round(160+440*dist/180);
  t.fl.style.transition=`transform ${dur}ms cubic-bezier(.3,.7,.25,1)`;
  t.shade.style.transition=`opacity ${dur}ms linear`;
  underShade.style.transition=`opacity ${dur}ms linear`;
  void t.fl.offsetWidth; setAngle(t,end);
  setTimeout(()=>{
    if(commit){cur=t.target; if(t.dir===-1) fillCurrent(cur);} else if(t.dir===1) fillCurrent(cur);
    t.fl.remove(); underShade.style.transition='none'; underShade.style.opacity=0; turning=null; afterMove();
  },dur+30);
}
function jumpTo(i){i=Math.max(0,Math.min(PAGES.length-1,i)); if(i===cur||turning) return; const t=startTurn(i>cur?1:-1,i); if(t) animate(t,true);}
const turn=d=>jumpTo(cur+d);

let drag=null, suppressClick=false;
book.addEventListener('pointerdown',e=>{if(turning||e.button>0) return; drag={x:e.clientX,y:e.clientY,id:e.pointerId,t:null,t0:performance.now(),p:0};});
book.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id) return;
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  if(!drag.t){
    if(drag.dead) return;
    if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)){
      drag.t=startTurn(dx<0?1:-1);
      if(!drag.t){drag.dead=true;return;}
      drag.x=e.clientX; drag.t0=performance.now();
      try{book.setPointerCapture(e.pointerId)}catch(_){}
    }else if(Math.abs(dy)>14) drag=null;
    return;
  }
  const w=book.clientWidth, raw=drag.t.dir===1?-(e.clientX-drag.x):(e.clientX-drag.x);
  drag.p=Math.max(0,Math.min(1,raw/(w*.85)));
  setAngle(drag.t,drag.t.dir===1?-180*drag.p:-180*(1-drag.p));
});
function endDrag(){
  if(!drag) return; const d=drag; drag=null;
  if(d.t){suppressClick=true; setTimeout(()=>suppressClick=false,300);
    const fast=d.p>.06&&performance.now()-d.t0<260; animate(d.t,d.p>.4||fast);}
}
book.addEventListener('pointerup',endDrag);
book.addEventListener('pointercancel',endDrag);

book.addEventListener('click',e=>{
  if(suppressClick||turning) return;
  const act=e.target.closest('[data-act]');
  if(act){const a=act.dataset.act; if(a==='next') turn(1); else if(a==='start') jumpTo(0); else if(a==='practice') showView(renderPracticeSetup); return;}
  const j=e.target.closest('[data-jamo]');
  if(j){openWriteJamo(j.dataset.jamo); return;}
  const col=e.target.closest('[data-col]');
  if(col){const c=col.dataset.col; store.s.hide[c]=!store.s.hide[c]; store.save(); applyHide(); refresh(); return;}
  const row=e.target.closest('.row'); if(!row) return;
  const cell=e.target.closest('.c');
  if(cell){const lang=cell.classList.contains('c-en')?'en':cell.classList.contains('c-ko')?'ko':'ar';
    if(store.s.hide[lang]&&!cell.classList.contains('peek')){cell.classList.add('peek');return;}}
  const w=WORDS[+row.dataset.w]; showView(()=>renderWord(w,false));
});
function applyHide(){['en','ko','ar'].forEach(l=>$('#app').classList.toggle('hide-'+l,!!store.s.hide[l]));}

/* ---------- speech ---------- */
let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices()||[]}catch(e){voices=[]}}
if('speechSynthesis' in window){loadVoices(); speechSynthesis.onvoiceschanged=loadVoices;}
function speak(text,lang){
  if(!('speechSynthesis' in window)){toast('Audio is not available in this browser.');return;}
  const pref={en:['en-gb','en-us','en'],ko:['ko-kr','ko'],ar:['ar-ae','ar-sa','ar']}[lang];
  let v=null;
  for(const p of pref){v=voices.find(x=>x.lang.replace('_','-').toLowerCase().startsWith(p)); if(v) break;}
  if(!v&&voices.length&&lang!=='en') toast(`No ${lang==='ko'?'Korean':'Arabic'} voice on this device. Add one in your phone’s language settings.`);
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  if(v){u.voice=v;u.lang=v.lang;} else u.lang={en:'en-GB',ko:'ko-KR',ar:'ar-AE'}[lang];
  u.rate=lang==='en'?.95:.8;
  speechSynthesis.speak(u);
}
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2800);}

/* ---------- sheet ---------- */
const sheet=$('#sheet'), sBody=$('#sheet-body'), sBack=$('#sheet-back');
let viewStack=[], currentView=null;
const isOpen=()=>sheet.classList.contains('open');
function openSheet(title,html,mount){

  if(mount) mount(sBody);

}
function showView(fn,push){
  if(push&&currentView&&isOpen()) viewStack.push(currentView); else viewStack=[];
  currentView=fn; fn(); sBack.hidden=viewStack.length===0;
}
function closeSheet(){sheet.classList.remove('open');viewStack=[];currentView=null;}
sBack.onclick=()=>{currentView=viewStack.pop(); if(currentView) currentView(); sBack.hidden=viewStack.length===0;};
$('#sheet-close').onclick=closeSheet;
sheet.addEventListener('click',e=>{if(e.target===sheet) closeSheet();});
const listClick=e=>{const r=e.target.closest('.row'); if(r){const w=WORDS[+r.dataset.w]; showView(()=>renderWord(w,true),true);}};

function renderWord(w,fromList){
  const blocks=['en','ko','ar'].map(l=>{const sub=dsub(l,w);
    return `<div class="det-block ${l}"><div><div class="det-lang">${LANG[l].name}</div><div class="det-word lf-${dfont(l)}"${l==='ar'?' dir="rtl"':''}>${disp(l,w)}</div>${sub?`<div class="det-sub${l==='ko'&&romOn()?' lf-ko big':''}">${sub}</div>`:''}</div><button class="speak" data-speak="${l}" aria-label="Play ${LANG[l].name}">${ic('speaker')}</button></div>`;}).join('');
  const f=fav.has(w.id), l=learned.has(w.id);
  openSheet(CH[w.ch].en,`<div class="det">${blocks}<div class="det-actions"><button class="btn${f?' on':''}" data-fav>${ic('star',f)} ${f?'Saved':'Save'}</button><button class="btn${l?' on':''}" data-learn>${ic('check')} ${l?'Learned':'Mark learned'}</button><button class="btn primary wide" data-write>Practise writing</button>${fromList?`<button class="btn wide" data-goto>Open page ${wordPage(w)}</button>`:''}</div></div>`,body=>{
    body.onclick=e=>{
      const s=e.target.closest('[data-speak]'); if(s){speak(LANG[s.dataset.speak].get(w),s.dataset.speak);return;}

let lastQuery='';
function renderSearch(){

/* ---------- writing ---------- */
const wr={mode:'jamo',ji:0,wi:null,lang:'ko',model:true};

function writeWords(){const s=WORDS.filter(w=>fav.has(w.id)); return s.length?s:CH[curChapter()].items;}

    <p class="pad-info">${info}</p>
    <div class="pad-btns">
      ${jamoMode?`<button class="btn primary" data-strokes>Show strokes</button>`:`<button class="btn" data-say>${ic('speaker')} Listen</button>`}
      <button class="btn" data-undo>Undo</button>
      <button class="btn" data-clear>Clear</button>
      <button class="btn" data-model>${wr.model?'Hide model':'Show model'}</button>
    </div>`,body=>{
    const pad=setupPad(body.querySelector('.pad-ink'));
    body.onclick=e=>{
      const m=e.target.closest('[data-mode]'); if(m){wr.mode=m.dataset.mode; renderWrite(); return;}
      const lg=e.target.closest('[data-lang]'); if(lg){wr.lang=lg.dataset.lang; renderWrite(); return;}
      const jc=e.target.closest('[data-j]'); if(jc){wr.ji=+jc.dataset.j; renderWrite(); return;}
      const wc=e.target.closest('[data-wi]'); if(wc){wr.wi=+wc.dataset.wi; renderWrite(); return;}
      if(e.target.closest('[data-undo]')){pad.undo(); return;}
      if(e.target.closest('[data-clear]')){pad.clear(); return;}
      if(e.target.closest('[data-model]')){wr.model=!wr.model; renderWrite(); return;}
      if(e.target.closest('[data-say]')){speak(target,wr.lang); return;}
      if(e.target.closest('[data-strokes]')) playStrokes(body.querySelector('.pad-strokes'),JAMO[wr.ji].s);
    };
    const on=body.querySelector('.schip.on'); if(on) on.scrollIntoView({block:'nearest',inline:'center'});
    if(jamoMode) setTimeout(()=>playStrokes(body.querySelector('.pad-strokes'),JAMO[wr.ji].s),260);
  });
}
function setupPad(cv){
  const ctx=cv.getContext('2d'), rect=cv.getBoundingClientRect(), dpr=Math.min(3,window.devicePixelRatio||1);
  cv.width=Math.max(1,rect.width*dpr); cv.height=Math.max(1,rect.height*dpr); ctx.scale(dpr,dpr);
  ctx.lineWidth=8; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--ink').trim()||'#222';
  let strokes=[], cur=null;
  const pos=e=>{const b=cv.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top];};
  const redraw=()=>{ctx.clearRect(0,0,rect.width,rect.height);
    strokes.forEach(s=>{ctx.beginPath();s.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();});};
  cv.addEventListener('pointerdown',e=>{try{cv.setPointerCapture(e.pointerId)}catch(_){}
    cur=[pos(e)]; strokes.push(cur); redraw(); e.preventDefault();});
  cv.addEventListener('pointermove',e=>{if(!cur) return; cur.push(pos(e)); redraw(); e.preventDefault();});
  const up=()=>{cur=null;};
  cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up); cv.addEventListener('pointerleave',up);
  return {undo(){strokes.pop();redraw();},clear(){strokes=[];redraw();}};
}
function playStrokes(svg,paths){
  if(!svg) return;
  svg.innerHTML=paths.map(d=>`<path d="${d}"/>`).join(''); svg.style.opacity='1';
  const els=[...svg.querySelectorAll('path')]; let t=0;
  els.forEach(p=>{const L=p.getTotalLength(); p.style.strokeDasharray=L; p.style.strokeDashoffset=L;});
  els.forEach(p=>{const dur=REDUCED?0:520;
    setTimeout(()=>{p.style.transition=`stroke-dashoffset ${dur}ms linear`; p.style.strokeDashoffset='0';},t);
    t+=dur+150;});
  setTimeout(()=>{svg.style.opacity='0'; setTimeout(()=>{svg.innerHTML='';},500);},t+900);
}

/* ---------- practice ---------- */
const pq={from:'en',to:'ko',pool:'chapter',qs:[],n:0,score:0,missed:[]};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function renderPracticeSetup(msg){
  const chip=(g,v,label)=>`<button class="chip" data-g="${g}" data-v="${v}" aria-pressed="${pq[g]===v}">${label}</button>`;
  const ci=curChapter();
  openSheet('Practice',`<h4>Show me</h4><div class="chips">${['en','ko','ar'].map(l=>chip('from',l,LANG[l].name)).join('')}</div><h4>I answer in</h4><div class="chips">${['en','ko','ar'].map(l=>chip('to',l,LANG[l].name)).join('')}</div><h4>Words from</h4><div class="chips">${chip('pool','chapter',CH[ci].en)}${chip('pool','book','Whole book')}${chip('pool','saved',`Saved (${fav.size})`)}</div>${msg?`<p class="warn">${msg}</p>`:''}<button class="btn primary wide" data-start>Start 10 questions</button>`,body=>{
    body.onclick=e=>{
      const c=e.target.closest('.chip');
      if(c){pq[c.dataset.g]=c.dataset.v;
        if(pq.from===pq.to){const other=['en','ko','ar'].find(l=>l!==pq[c.dataset.g]); if(c.dataset.g==='from') pq.to=other; else pq.from=other;}
        renderPracticeSetup(); return;}
      if(e.target.closest('[data-start]')) startPractice();
    };
  });
}
function startPractice(){
  const pool=pq.pool==='chapter'?CH[curChapter()].items:pq.pool==='saved'?WORDS.filter(w=>fav.has(w.id)):WORDS;
  if(pool.length<4){renderPracticeSetup('Save at least 4 words to practise with saved words.');return;}
  const T=LANG[pq.to];
  pq.qs=shuffle(pool.slice()).slice(0,Math.min(10,pool.length)).map(w=>{
    const cand=shuffle(CH[w.ch].items.filter(x=>x!==w));
    const seen=new Set([T.get(w)]), opts=[w];
    for(const x of cand){if(opts.length===4) break; if(!seen.has(T.get(x))){seen.add(T.get(x));opts.push(x);}}
    while(opts.length<4){const x=WORDS[Math.floor(Math.random()*WORDS.length)]; if(!seen.has(T.get(x))){seen.add(T.get(x));opts.push(x);}}
    return {w,opts:shuffle(opts)};
  });
  pq.n=0; pq.score=0; pq.missed=[]; renderQuestion();
}
function renderQuestion(){
  const q=pq.qs[pq.n], F=LANG[pq.from], T=LANG[pq.to], last=pq.n+1>=pq.qs.length;
  openSheet('Practice',`<div class="q-top"><span>Question ${pq.n+1} of ${pq.qs.length}</span><span>Score ${pq.score}</span></div><div class="bar"><i style="width:${pq.n/pq.qs.length*100}%"></i></div><div class="q-prompt"><div class="q-word lf-${dfont(pq.from)}"${pq.from==='ar'?' dir="rtl"':''}>${disp(pq.from,q.w)}</div>${dsub(pq.from,q.w)?`<div class="det-sub${pq.from==='ko'&&romOn()?' lf-ko':''}">${dsub(pq.from,q.w)}</div>`:''}<button class="speak sm" data-say aria-label="Play">${ic('speaker')}</button></div><div class="q-opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="lf-${dfont(pq.to)}"${pq.to==='ar'?' dir="rtl"':''}>${disp(pq.to,o)}</span>${dsub(pq.to,o)?`<small${pq.to==='ko'&&romOn()?' class="lf-ko"':''}>${dsub(pq.to,o)}</small>`:''}</button>`).join('')}</div><button class="btn primary wide" data-next hidden>${last?'See results':'Next question'}</button>`,body=>{
    let done=false;
    body.onclick=e=>{
      if(e.target.closest('[data-say]')){speak(F.get(q.w),pq.from);return;}
      const b=e.target.closest('.opt');
      if(b&&!done){done=true; const ok=q.opts[+b.dataset.k]===q.w;
        if(ok) pq.score++; else pq.missed.push(q.w);
        body.querySelectorAll('.opt').forEach((el,k)=>{el.disabled=true; if(q.opts[k]===q.w) el.classList.add('right');});
        if(!ok) b.classList.add('wrong');
        speak(T.get(q.w),pq.to); body.querySelector('[data-next]').hidden=false; return;}
      if(e.target.closest('[data-next]')){pq.n++; pq.n<pq.qs.length?renderQuestion():renderResult();}
    };
  });
}
function renderResult(){
  const n=pq.qs.length;
  openSheet('Practice',`<div class="score">${pq.score}/${n}</div><p class="score-sub">${pq.score===n?'Every answer right.':pq.missed.length+' to review. Tap a word to hear it again.'}</p>${pq.missed.length?`<ul class="list">${pq.missed.map(rowHTML).join('')}</ul>`:''}<div class="det-actions" style="margin-top:16px"><button class="btn primary" data-again>Practise again</button><button class="btn" data-setup>Change settings</button></div>`,body=>{
    body.onclick=e=>{
      if(e.target.closest('[data-again]')){startPractice();return;}
      if(e.target.closest('[data-setup]')){renderPracticeSetup();return;}
      const r=e.target.closest('.row'); if(r){const w=WORDS[+r.dataset.w]; showView(()=>renderWord(w,true),true);}
    };
  });
}

/* ---------- chrome ---------- */
$('#prev').innerHTML=ic('left'); $('#next').innerHTML=ic('right'); $('#theme').innerHTML=ic('theme');
sBack.innerHTML=ic('left'); $('#sheet-close').innerHTML=ic('close');
const TABS={contents:['book','Contents',renderContents],search:['search','Search',renderSearch],write:['pen','Write',renderWrite],saved:['star','Saved',renderSaved],practice:['cards','Practice',()=>renderPracticeSetup()]};
document.querySelectorAll('.tab').forEach(b=>{const [i,l,fn]=TABS[b.dataset.tab]; b.innerHTML=ic(i)+l; b.onclick=()=>showView(fn);});
$('#prev').onclick=()=>turn(-1); $('#next').onclick=()=>turn(1);
function paintRoman(){$('#roman').innerHTML=`<span>${romOn()?'한':'A'}</span>`;}
paintRoman();
$('#roman').onclick=()=>{store.s.roman=!romOn(); store.save(); paintRoman(); refresh();
  toast(romOn()?'Korean shown in Roman letters first.':'Korean shown in Hangul first.');};
$('#theme').onclick=()=>{store.s.theme=isDark()?'light':'dark'; store.save(); applyTheme();};
scrub.addEventListener('input',()=>{$('#where-p').textContent=`Go to page ${scrub.value}`;});
scrub.addEventListener('change',()=>{const v=+scrub.value; if(v!==cur) jumpTo(v); else afterMove();});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&isOpen()){closeSheet();return;}
  if(isOpen()||/input|textarea/i.test(e.target.tagName)) return;
  if(e.key==='ArrowRight') turn(1); if(e.key==='ArrowLeft') turn(-1);
});

function layout(){
  const anchor=PAGES.length?anchorOf(PAGES[cur]):store.s.anchor;
  perPage=computePerPage(); buildPages(); cur=findAnchor(anchor); showCurrent();
}
let rt;
window.addEventListener('resize',()=>{clearTimeout(rt); rt=setTimeout(()=>{if(turning) return; if(computePerPage()!==perPage) layout();},160);});
applyHide();
requestAnimationFrame(layout);
</script>
